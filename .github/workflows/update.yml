name: Daten aktualisieren
on:
  schedule: [{cron: "0 5 * * 1-5"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance pandas lxml requests
      - run: python scripts/fetch_data.py
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data; git commit -m "Daten-Update" || exit 0; git push
